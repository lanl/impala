name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # allow manual trigger

jobs:
  test:
    if: >
      ${{
        !(
          startsWith(github.event.head_commit.message, '[NOTEST]')
        )
      }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.4"
      - name: Test against latest supported dependencies
        if: matrix.python-version == '3.15'
        run: uv run -p 3.15 --isolated --resolution=highest pytest -n auto -rP --durations=0
      - name: Test against oldest supported dependencies
        if: matrix.python-version == '3.10'
        run: uv run -p 3.10 --isolated --resolution=lowest-direct pytest -n auto -rP --durations=0
