name: Ruff
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.4"
          args: "--version"
      - run: ruff check
      - run: ruff format --check
